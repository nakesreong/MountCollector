name: Package & Release MountCollector

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CurseForge / WoW AddOn Zip
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.1.0}"
          mkdir -p build/MountCollector
          cp MountCollector.toc Locales.lua MountDropsDB.lua Core.lua Tooltips.lua RadarUI.lua Config.lua README.md CHANGELOG.md LICENSE build/MountCollector/
          cp -r Libs build/MountCollector/
          cd build
          zip -r "../MountCollector-${VERSION}.zip" MountCollector

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MountCollector-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md
          generate_release_notes: true
